server:
  port: 17891

spring:
  config:
    import:
      - optional:file:.clawagent/config/clawagent.yml
      - optional:file:../.clawagent/config/clawagent.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB

logging:
  file:
    name: logs/clawagent.log
  level:
    root: INFO
    com.github.clawagent: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] traceId=%X{traceId:-} sessionId=%X{sessionId:-} taskId=%X{taskId:-} userId=%X{userId:-} channelId=%X{channelId:-} %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] traceId=%X{traceId:-} sessionId=%X{sessionId:-} taskId=%X{taskId:-} userId=%X{userId:-} channelId=%X{channelId:-} %logger{36} - %msg%n"

clawagent:
  enabled: true
  path:
    base: .clawagent
  attachments:
    storage: local
    local:
      path: ${clawagent.path.base}/attachments
  persistence:
    type: sqlite
    sqlite:
      path: ${clawagent.path.base}/clawagent.db
  memory:
    markdown:
      enabled: true
      path: ${clawagent.path.base}/memory
    vector:
      enabled: false
      provider: none
      embedding:
        provider: none
        model: ""
        base-url: ""
        api-key-env: CLAWAGENT_EMBEDDING_API_KEY
        dimensions: 0
        timeout-seconds: 60
  mcp:
    enabled: true
    auto-connect: true
    path:
      - ${clawagent.path.base}/mcp/mcp.json
  skills:
    enabled: true
    path:
      - ${clawagent.path.base}/skills
  runtime:
    max-react-rounds: 15
    sanitization:
      enabled: true
  automation:
    enabled: true
    poll-interval-seconds: 5
    due-batch-size: 10
    default-channel-id: automation
    default-user-id: automation
  toolkit:
    enabled: true
    tools:
      time:
        enabled: true
        env: {}
      weather:
        enabled: true
        env: {}
      content:
        enabled: true
        env:
          PATH: "${clawagent.path.base}/artifacts"
          CHUNK_CHARS: "6000"
          SUMMARY_CHARS: "2400"
          READ_MAX_CHARS: "12000"
      web-fetch:
        enabled: true
        env:
          ALLOW_PRIVATE_ADDRESSES: "true"
          ALLOWED_HOSTS: "192.168.6.160"
          MAX_OUTPUT_CHARS: "12000"
      web-search:
        enabled: true
        env:
          PROVIDER: bocha
          BOCHA_API_KEY: ${BOCHA_API_KEY:}
          BOCHA_ENDPOINT: https://api.bochaai.com/v1/web-search
          BOCHA_COUNT: "5"
          BOCHA_FRESHNESS: noLimit
          BOCHA_SUMMARY: "true"
          BOCHA_TIMEOUT_MS: "60000"
          BOCHA_MAX_OUTPUT_CHARS: "12000"
      execute:
        enabled: true
        env:
          ALLOWED_ROOTS: "${clawagent.path.base}/workspace/codex"
          TIMEOUT_MS: "30000"
          MAX_OUTPUT_CHARS: "20000"
      todo:
        enabled: true
        env: {}
      filesystem:
        enabled: true
        env:
          READONLY: "true"
          ALLOWED_ROOTS: "D:/workspace/codex"
          BLOCKED_PATTERNS: "**/.git/**,**/*.key,**/*.pem,**/.env"
          MAX_READ_BYTES: "1048576"
          MAX_SEARCH_RESULTS: "100"
  model:
    mode: llm
    planner: react
    default: deepseek-v4-flash
  models:
    deepseek-v4-flash:
      provider: deepseek
      base-url: https://api.deepseek.com
      model: deepseek-v4-flash
      api-key: ${DEEPSEEK_API_KEY}
      temperature: 0.2
      timeout-seconds: 60
