server:
  port: 17891

spring:
  config:
    import:
      - optional:file:.clawagent/config/clawagent.yml
      - optional:file:../.clawagent/config/clawagent.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB

logging:
  file:
    name: logs/clawagent.log
  level:
    root: INFO
    com.github.clawagent: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] traceId=%X{traceId:-} sessionId=%X{sessionId:-} taskId=%X{taskId:-} userId=%X{userId:-} channelId=%X{channelId:-} %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] traceId=%X{traceId:-} sessionId=%X{sessionId:-} taskId=%X{taskId:-} userId=%X{userId:-} channelId=%X{channelId:-} %logger{36} - %msg%n"

clawagent:
  enabled: true
  auth:
    api-token-required: false
    protected-path-patterns:
      - /api/v1/**
    excluded-path-patterns:
      - /api/v1/health
    scope-mappings:
      tasks:
        - /api/v1/tasks/**
        - /api/v1/steps/**
        - /api/v1/agents/**
        - /api/v1/todos/**
      plans:
        - /api/v1/plans/**
      sessions:
        - /api/v1/sessions/**
      auth:
        - /api/v1/auth/**
      channels:
        - /api/v1/channels/**
      config:
        - /api/v1/config/**
      knowledge:
        - /api/v1/knowledge/**
      memory:
        - /api/v1/memory/**
      mcp:
        - /api/v1/mcp/**
      skills:
        - /api/v1/skills/**
      attachments:
        - /api/v1/attachments/**
  rate-limit:
    enabled: false
    default-limit: 120
    default-window-seconds: 60
    protected-path-patterns:
      - /api/v1/**
    excluded-path-patterns:
      - /api/v1/health
    rules:
      - name: task-write
        path-patterns:
          - /api/v1/tasks/**
          - /api/v1/agents/**
          - /api/v1/plans/**
        methods:
          - POST
          - PUT
          - PATCH
          - DELETE
        limit: 30
        window-seconds: 60
  path:
    base: .clawagent
  attachments:
    storage: local
    local:
      path: ${clawagent.path.base}/attachments
  persistence:
    type: sqlite
    sqlite:
      path: ${clawagent.path.base}/clawagent.db
  memory:
    markdown:
      enabled: true
      path: ${clawagent.path.base}/memory
    vector:
      enabled: true
      provider: jvector
      embedding:
        provider: siliconflow
        model: BAAI/bge-m3
        base-url: https://api.siliconflow.cn/v1
        api-key: ${SILICONFLOW_API_KEY:}
        dimensions: 0
        timeout-seconds: 60
  intent:
    enabled: true
    threshold: 0.78
  mcp:
    enabled: true
    auto-connect: true
    path:
      - ${clawagent.path.base}/mcp/mcp.json
  skills:
    enabled: true
    path:
      - ${clawagent.path.base}/skills
  channels:
    adapter-path:
      - ${clawagent.path.base}/channels/adapters
    configs:
      feishu:
        defaultAccount: main
        dmPolicy: open
        accounts:
          main:
            name: 主助手 - 飞书机器人
            enabled: true
            approvalMode: auto
            appId: ${FEISHU_APP_ID:}
            appSecret: ${FEISHU_APP_SECRET:}
            outboundMessageType: auto
      ddio:
        accounts:
          main:
            name: DDIO Bot
            enabled: true
            approvalMode: auto
            appId: ${DDIO_APP_ID:}
            appSecret: ${DDIO_APP_SECRET:}
            baseUrl: ${DDIO_BASE_URL:}
      dingtalk:
        defaultAccount: main
        accounts:
          main:
            name: 钉钉机器人
            enabled: false
            approvalMode: auto
            connectionMode: stream
            agentId: ${DINGTALK_AGENT_ID:}
            appKey: ${DINGTALK_APP_KEY:}
            appSecret: ${DINGTALK_APP_SECRET:}
            outboundMessageType: markdown
  runtime:
    max-react-rounds: 15
    sanitization:
      enabled: true
  agents:
    policies:
      coder:
        enabled: false
        permission-mode: custom
        approved-tool-ids:
          - builtin.filesystem.read_text_file
          - builtin.filesystem.write_text_file
          - builtin.execute.command
      reviewer:
        enabled: false
        permission-mode: read-only
        approved-tool-ids: []
    worker:
      enabled: false
      mode: external-process
      command: ""
      args: []
      max-concurrent: 2
      acquire-timeout-ms: 5000
      timeout-ms: 300000
      max-output-bytes: 1048576
  automation:
    enabled: true
    poll-interval-seconds: 5
    due-batch-size: 10
    default-channel-id: automation
    default-user-id: automation
  local:
    workspace-root: "${clawagent.path.base}/workspace"
    default-shell: powershell
    permission-mode: ask
    approved-tool-ids: []
    allowed-roots:
      - "${clawagent.path.base}/workspace"
      - "."
    recent-projects: []
    test-commands: []
    project-test-commands: {}
    ignore-patterns:
      - "**/.git/**"
      - ".git/**"
      - "**/.clawagent/**"
      - ".clawagent/**"
      - "**/node_modules/**"
      - "node_modules/**"
      - "**/target/**"
      - "target/**"
      - "**/build/**"
      - "build/**"
      - "**/dist/**"
      - "dist/**"
      - "**/.idea/**"
      - ".idea/**"
      - "**/.vscode/**"
      - ".vscode/**"
    sensitive-path-patterns:
      - "**/.env"
      - ".env"
      - "**/.env.*"
      - ".env.*"
      - "**/*.key"
      - "**/*.pem"
      - "**/*.p12"
      - "**/*.pfx"
      - "**/.ssh/**"
      - ".ssh/**"
      - "**/.git/**"
      - ".git/**"
  toolkit:
    enabled: true
    tools:
      time:
        enabled: true
        env: {}
      weather:
        enabled: true
        env: {}
      content:
        enabled: true
        env:
          PATH: "${clawagent.path.base}/artifacts"
          CHUNK_CHARS: "6000"
          SUMMARY_CHARS: "2400"
          READ_MAX_CHARS: "12000"
      web-fetch:
        enabled: true
        env:
          ALLOW_PRIVATE_ADDRESSES: "true"
          ALLOWED_HOSTS: "192.168.6.160"
          MAX_OUTPUT_CHARS: "12000"
      web-search:
        enabled: true
        env:
          PROVIDER: bocha
          BOCHA_ENDPOINT: https://api.bochaai.com/v1/web-search
          BOCHA_API_KEY: ${BOCHA_API_KEY:}
          BOCHA_COUNT: "5"
          BOCHA_FRESHNESS: noLimit
          BOCHA_SUMMARY: "true"
          BOCHA_TIMEOUT_MS: "60000"
          BOCHA_MAX_OUTPUT_CHARS: "12000"
      execute:
        enabled: true
        env:
          ALLOWED_ROOTS: "${clawagent.path.base},."
          DEFAULT_CWD: "${clawagent.path.base}/workspace"
          TIMEOUT_MS: "30000"
          MAX_TIMEOUT_MS: "120000"
          PROCESS_WAIT_MS: "5000"
          MAX_OUTPUT_CHARS: "20000"
          WORKER_ENABLED: "true"
          WORKER_JAR: "claw-agent-worker/target/claw-agent-worker-1.0.0-SNAPSHOT.jar"
          WORKER_JAVA: ""
          WORKER_JVM_MAX_HEAP: "256m"
          WORKER_MAX_OUTPUT_BYTES: "1048576"
          WORKER_MAX_CPU_TIME_MS: "0"
          WORKER_MAX_MEMORY_BYTES: "0"
          WORKER_MAX_CONCURRENT: "2"
          WORKER_ACQUIRE_TIMEOUT_MS: "5000"
          WORKER_TERMINATION_GRACE_MS: "1500"
          WORKER_BLOCKED_ENV_NAME_FRAGMENTS: "TOKEN,SECRET,PASSWORD,PASSWD,API_KEY,ACCESS_KEY,PRIVATE_KEY,CREDENTIAL,AUTHORIZATION,COOKIE"
          SENSITIVE_PATH_PATTERNS: "**/.env,.env,**/.env.*,.env.*,**/*.key,**/*.pem,**/*.p12,**/*.pfx,**/.ssh/**,.ssh/**,**/.git/**,.git/**"
      todo:
        enabled: true
        env: {}
      filesystem:
        enabled: true
        env:
          READONLY: "false"
          ALLOWED_ROOTS: "${clawagent.path.base}"
          DEFAULT_CWD: "${clawagent.path.base}/workspace"
          BLOCKED_PATTERNS: "**/.env,.env,**/.env.*,.env.*,**/*.key,**/*.pem,**/*.p12,**/*.pfx,**/.ssh/**,.ssh/**,**/.git/**,.git/**"
          MAX_READ_BYTES: "1048576"
          MAX_SEARCH_RESULTS: "100"
  model:
    mode: llm
    planner: react
    default: deepseek-v4-flash
    memory-model: siliconflow-qwen3-8b
    vision-model: qwen3-vl
  models:
    deepseek-v4-flash:
      provider: deepseek
      base-url: https://api.deepseek.com
      model: deepseek-v4-flash
      api-key: ${DEEPSEEK_API_KEY:}
      temperature: 0.2
      timeout-seconds: 60
      vision: false
    siliconflow-qwen3-8b:
      provider: siliconflow
      base-url: https://api.siliconflow.cn/v1
      model: Qwen/Qwen3-8B
      api-key: ${SILICONFLOW_API_KEY:}
      temperature: 0.2
      timeout-seconds: 60
      vision: false
    qwen3-vl:
      provider: dashscope
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen3-vl-flash
      api-key: ${DASHSCOPE_API_KEY:}
      temperature: 0.2
      timeout-seconds: 60
      vision: true
