<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClawAgent Console</title>
  <style>
    body { font-family: Arial, "Microsoft YaHei", sans-serif; margin: 0; background: #f7f8fa; color: #1f2937; }
    header { background: #111827; color: white; padding: 18px 28px; }
    main { max-width: 1120px; margin: 24px auto; padding: 0 20px; }
    section { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 18px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; border-bottom: 1px solid #e5e7eb; }
    .tab-button { background: transparent; color: #374151; border-radius: 6px 6px 0 0; border: 1px solid transparent; border-bottom: 0; padding: 10px 14px; }
    .tab-button:hover { background: #eef2ff; color: #1d4ed8; }
    .tab-button.active { background: white; color: #1d4ed8; border-color: #e5e7eb; font-weight: 700; margin-bottom: -1px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    label { display: block; font-weight: 600; margin: 10px 0 6px; }
    input, textarea, select { width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px; }
    textarea { min-height: 90px; }
    button { padding: 8px 14px; border: 0; background: #2563eb; color: white; border-radius: 6px; cursor: pointer; }
    button.secondary { background: #4b5563; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    pre { background: #0f172a; color: #e5e7eb; padding: 14px; border-radius: 6px; overflow: auto; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header>
  <h1>ClawAgent Console</h1>
  <div>本页面用于验证任务、会话、消息、工具和 MCP 注册能力。</div>
</header>
<main>
  <nav class="tabs" aria-label="控制台模块">
    <button class="tab-button active" type="button" data-tab="task" onclick="showTab('task')">任务</button>
    <button class="tab-button" type="button" data-tab="session" onclick="showTab('session')">会话与日志</button>
    <button class="tab-button" type="button" data-tab="mcp" onclick="showTab('mcp')">MCP Server</button>
    <button class="tab-button" type="button" data-tab="skills" onclick="showTab('skills')">Skills</button>
    <button class="tab-button" type="button" data-tab="tools" onclick="showTab('tools')">工具能力</button>
  </nav>

  <section id="tab-task" class="tab-panel active">
    <h2>提交任务</h2>
    <label for="sessionId">Session ID</label>
    <input id="sessionId" placeholder="留空会自动创建会话">
    <label for="query">输入</label>
    <textarea id="query"></textarea>
    <div class="actions">
      <button onclick="submitTask()">运行</button>
      <button class="secondary" onclick="loadSessionMessages()">查看当前会话消息</button>
    </div>
    <pre id="result">等待提交...</pre>
  </section>
  <section id="tab-session" class="tab-panel">
    <h2>会话与消息</h2>
    <div class="actions">
      <button onclick="createSession()">创建会话</button>
      <button class="secondary" onclick="loadSessions()">刷新会话列表</button>
      <button class="secondary" onclick="loadSessionTasks()">查看当前会话任务</button>
      <button class="secondary" onclick="loadSessionMessages()">查看当前会话消息</button>
      <button class="secondary" onclick="loadSessionEvents()">查看当前会话日志</button>
    </div>
    <div class="grid">
      <pre id="sessions">等待加载会话...</pre>
      <pre id="messages">等待加载消息...</pre>
    </div>
  </section>
  <section id="tab-mcp" class="tab-panel">
    <h2>MCP Server</h2>
    <label for="mcpImportJson">导入 mcpServers JSON</label>
    <textarea id="mcpImportJson">{
  "mcpServers": {
    "filesystem": {
      "command": "npx",
      "args": ["-y", "@modelcontextprotocol/server-filesystem", "D:\\workspace\\codex"],
      "env": {}
    }
  }
}</textarea>
    <div class="actions">
      <button onclick="importMcpServers()">导入 JSON</button>
    </div>
    <div class="grid">
      <div>
        <label for="mcpId">ID</label>
        <input id="mcpId" value="filesystem">
        <label for="mcpName">名称</label>
        <input id="mcpName" value="Filesystem">
        <label for="mcpTransport">传输</label>
        <select id="mcpTransport" onchange="updateMcpTransportFields()">
          <option selected>STDIO</option>
          <option>HTTP</option>
          <option>SSE</option>
          <option>STREAMABLE_HTTP</option>
        </select>
      </div>
      <div>
        <div id="stdioFields">
          <label for="mcpCommand">Command</label>
          <input id="mcpCommand" value="npx">
          <label for="mcpArgs">Args JSON Array</label>
          <textarea id="mcpArgs">["-y", "@modelcontextprotocol/server-filesystem", "D:\\workspace\\codex"]</textarea>
        </div>
        <div id="remoteFields">
          <label for="mcpEndpoint">Endpoint / URL</label>
          <input id="mcpEndpoint" value="http://localhost:18080/mcp">
          <label for="mcpHeaders">Headers JSON</label>
          <textarea id="mcpHeaders">{}</textarea>
        </div>
        <label for="mcpEnv">Env JSON</label>
        <textarea id="mcpEnv">{}</textarea>
      </div>
    </div>
    <div class="actions">
      <button onclick="testMcpServer()">测试连接</button>
      <button onclick="registerMcpServer()">保存 MCP Server</button>
      <button onclick="connectMcpServer()">连接</button>
      <button class="secondary" onclick="refreshMcpTools()">刷新 MCP Tools</button>
      <button class="secondary" onclick="loadMcpTools()">查看 MCP Tools</button>
      <button class="secondary" onclick="disconnectMcpServer()">断开</button>
      <button class="secondary" onclick="loadMcpServers()">刷新 MCP Server</button>
    </div>
    <pre id="mcpServers">等待加载 MCP Server...</pre>
  </section>
  <section id="tab-skills" class="tab-panel">
    <h2>Skill 管理</h2>
    <div class="grid">
      <div>
        <label for="skillId">ID</label>
        <input id="skillId" value="demo-skill">
        <label for="skillName">名称</label>
        <input id="skillName" value="Demo Skill">
        <label for="skillVersion">版本</label>
        <input id="skillVersion" value="0.1.0">
        <label for="skillEntrypoint">入口</label>
        <input id="skillEntrypoint" value="README.md">
        <label for="skillTools">工具 JSON Array</label>
        <textarea id="skillTools">["default"]</textarea>
      </div>
      <div>
        <label for="skillDescription">描述</label>
        <textarea id="skillDescription">本地 Skill 示例，用于验证安装、启停和本地保存。</textarea>
        <label for="skillPermissions">权限 JSON Array</label>
        <textarea id="skillPermissions">[]</textarea>
        <label for="skillContent">内容</label>
        <textarea id="skillContent"># Demo Skill&#10;&#10;这里可以保存 Skill 的说明、提示词或后续脚本入口。</textarea>
      </div>
    </div>
    <div class="actions">
      <button onclick="installSkill()">安装 Skill</button>
      <button class="secondary" onclick="enableSkill()">启用</button>
      <button class="secondary" onclick="disableSkill()">禁用</button>
      <button class="secondary" onclick="loadSkills()">刷新 Skill</button>
    </div>
    <pre id="skills">等待加载 Skill...</pre>
  </section>
  <section id="tab-tools" class="tab-panel">
    <h2>工具能力</h2>
    <div class="actions"><button onclick="loadTools()">刷新工具列表</button></div>
    <pre id="tools">等待加载...</pre>
  </section>
</main>
<script>
let currentSessionId = '';

function showTab(tabName) {
  // Tab 只负责页面展示切换，不改变各模块原有表单字段和接口调用逻辑。
  document.querySelectorAll('.tab-button').forEach(button => {
    button.classList.toggle('active', button.dataset.tab === tabName);
  });
  document.querySelectorAll('.tab-panel').forEach(panel => {
    panel.classList.toggle('active', panel.id === `tab-${tabName}`);
  });
}

async function submitTask() {
  const input = document.getElementById('query').value;
  const sessionId = document.getElementById('sessionId').value.trim();
  const response = await fetch('/api/v1/tasks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ input, sessionId, channelId: 'webui', userId: 'console', metadata: {} })
  });
  const data = await response.json();
  document.getElementById('result').textContent = JSON.stringify(data, null, 2);
  if (data.taskId) {
    await loadSessions();
    currentSessionId = document.getElementById('sessionId').value.trim() || currentSessionId;
    await loadTaskEvents(data.taskId);
  }
}

async function createSession() {
  const response = await fetch('/api/v1/sessions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: '控制台会话', channelId: 'webui', userId: 'console', metadata: {} })
  });
  const data = await response.json();
  currentSessionId = data.id;
  document.getElementById('sessionId').value = data.id;
  document.getElementById('sessions').textContent = JSON.stringify(data, null, 2);
}

async function loadSessions() {
  const response = await fetch('/api/v1/sessions?limit=20');
  const data = await response.json();
  if (!currentSessionId && data.length > 0) {
    currentSessionId = data[0].id;
    document.getElementById('sessionId').value = currentSessionId;
  }
  document.getElementById('sessions').textContent = JSON.stringify(data, null, 2);
}

async function loadSessionTasks() {
  const sessionId = activeSessionId();
  const response = await fetch(`/api/v1/sessions/${encodeURIComponent(sessionId)}/tasks?limit=20`);
  document.getElementById('messages').textContent = JSON.stringify(await response.json(), null, 2);
}

async function loadSessionMessages() {
  const sessionId = activeSessionId();
  const response = await fetch(`/api/v1/sessions/${encodeURIComponent(sessionId)}/messages?limit=100`);
  document.getElementById('messages').textContent = JSON.stringify(await response.json(), null, 2);
}

async function loadSessionEvents() {
  const sessionId = activeSessionId();
  const response = await fetch(`/api/v1/sessions/${encodeURIComponent(sessionId)}/events?limit=200`);
  document.getElementById('messages').textContent = JSON.stringify(await response.json(), null, 2);
}

async function loadTaskEvents(taskId) {
  const response = await fetch(`/api/v1/tasks/${encodeURIComponent(taskId)}/events?limit=200`);
  document.getElementById('messages').textContent = JSON.stringify(await response.json(), null, 2);
}

async function registerMcpServer() {
  const body = mcpFormBody();
  const response = await fetch('/api/v1/mcp/servers', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  document.getElementById('mcpServers').textContent = JSON.stringify(await response.json(), null, 2);
  await loadMcpServers();
}

async function testMcpServer() {
  const response = await fetch('/api/v1/mcp/servers/test', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(mcpFormBody())
  });
  document.getElementById('mcpServers').textContent = JSON.stringify(await response.json(), null, 2);
}

function mcpFormBody() {
  const transport = document.getElementById('mcpTransport').value;
  return {
    id: document.getElementById('mcpId').value.trim(),
    name: document.getElementById('mcpName').value.trim(),
    transport,
    endpoint: transport === 'STDIO' ? null : document.getElementById('mcpEndpoint').value.trim(),
    command: transport === 'STDIO' ? document.getElementById('mcpCommand').value.trim() : null,
    args: transport === 'STDIO' ? parseJsonArray('mcpArgs') : [],
    env: parseJsonObject('mcpEnv'),
    headers: transport === 'STDIO' ? {} : parseJsonObject('mcpHeaders'),
    enabled: true
  };
}

async function importMcpServers() {
  const response = await fetch('/api/v1/mcp/import', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ json: document.getElementById('mcpImportJson').value })
  });
  document.getElementById('mcpServers').textContent = JSON.stringify(await response.json(), null, 2);
}

async function connectMcpServer() {
  const response = await fetch(`/api/v1/mcp/servers/${encodeURIComponent(activeMcpId())}/connect`, { method: 'POST' });
  document.getElementById('mcpServers').textContent = JSON.stringify(await response.json(), null, 2);
  await loadTools();
}

async function disconnectMcpServer() {
  const response = await fetch(`/api/v1/mcp/servers/${encodeURIComponent(activeMcpId())}/disconnect`, { method: 'POST' });
  document.getElementById('mcpServers').textContent = JSON.stringify(await response.json(), null, 2);
  await loadTools();
}

async function refreshMcpTools() {
  const response = await fetch(`/api/v1/mcp/servers/${encodeURIComponent(activeMcpId())}/refresh-tools`, { method: 'POST' });
  document.getElementById('mcpServers').textContent = JSON.stringify(await response.json(), null, 2);
  await loadTools();
}

async function loadMcpTools() {
  const response = await fetch(`/api/v1/mcp/servers/${encodeURIComponent(activeMcpId())}/tools`);
  document.getElementById('mcpServers').textContent = JSON.stringify(await response.json(), null, 2);
}

async function loadMcpServers() {
  const response = await fetch('/api/v1/mcp/servers');
  document.getElementById('mcpServers').textContent = JSON.stringify(await response.json(), null, 2);
}

async function loadTools() {
  const response = await fetch('/api/v1/tools');
  document.getElementById('tools').textContent = JSON.stringify(await response.json(), null, 2);
}

async function installSkill() {
  const body = {
    manifest: {
      id: document.getElementById('skillId').value.trim(),
      name: document.getElementById('skillName').value.trim(),
      version: document.getElementById('skillVersion').value.trim(),
      description: document.getElementById('skillDescription').value.trim(),
      enabled: true,
      entrypoint: document.getElementById('skillEntrypoint').value.trim(),
      tools: parseJsonArray('skillTools'),
      permissions: parseJsonArray('skillPermissions'),
      metadata: {}
    },
    content: document.getElementById('skillContent').value
  };
  const response = await fetch('/api/v1/skills', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  document.getElementById('skills').textContent = JSON.stringify(await response.json(), null, 2);
}

async function enableSkill() {
  const response = await fetch(`/api/v1/skills/${encodeURIComponent(activeSkillId())}/enable`, { method: 'POST' });
  document.getElementById('skills').textContent = JSON.stringify(await response.json(), null, 2);
}

async function disableSkill() {
  const response = await fetch(`/api/v1/skills/${encodeURIComponent(activeSkillId())}/disable`, { method: 'POST' });
  document.getElementById('skills').textContent = JSON.stringify(await response.json(), null, 2);
}

async function loadSkills() {
  const response = await fetch('/api/v1/skills');
  document.getElementById('skills').textContent = JSON.stringify(await response.json(), null, 2);
}

function activeSessionId() {
  const sessionId = document.getElementById('sessionId').value.trim() || currentSessionId;
  if (!sessionId) {
    throw new Error('请先创建会话或提交任务');
  }
  return sessionId;
}

function activeMcpId() {
  const id = document.getElementById('mcpId').value.trim();
  if (!id) {
    throw new Error('请先填写 MCP Server ID');
  }
  return id;
}

function activeSkillId() {
  const id = document.getElementById('skillId').value.trim();
  if (!id) {
    throw new Error('请先填写 Skill ID');
  }
  return id;
}

function parseJsonObject(elementId) {
  const text = document.getElementById(elementId).value.trim();
  if (!text) {
    return {};
  }
  return JSON.parse(text);
}

function parseJsonArray(elementId) {
  const text = document.getElementById(elementId).value.trim();
  if (!text) {
    return [];
  }
  const value = JSON.parse(text);
  if (!Array.isArray(value)) {
    throw new Error('Args 必须是 JSON 数组，例如 ["-y", "pkg"]');
  }
  return value;
}

function updateMcpTransportFields() {
  const transport = document.getElementById('mcpTransport').value;
  document.getElementById('stdioFields').style.display = transport === 'STDIO' ? 'block' : 'none';
  document.getElementById('remoteFields').style.display = transport === 'STDIO' ? 'none' : 'block';
}

loadTools();
loadSessions().catch(() => {});
loadMcpServers().catch(() => {});
loadSkills().catch(() => {});
updateMcpTransportFields();
</script>
</body>
</html>
